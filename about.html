<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GNE 근육병이란? - GNE 근육병 뉴스레터</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e293b;
      --sub: #64748b;
      --line: #e2e8f0;
      --primary: #3b82f6;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.95rem;
      color: var(--sub);
    }

    .page-header {
      padding: 80px 0;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0 0 20px;
      letter-spacing: -0.03em;
    }

    .page-subtitle {
      color: var(--sub);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .content {
      padding: 60px 0 120px;
    }

    .coming-soon {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 60px 40px;
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }

    .coming-soon-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .coming-soon h2 {
      font-size: 1.5rem;
      margin: 0 0 12px;
    }

    .coming-soon p {
      color: var(--sub);
      margin-bottom: 28px;
    }

    .btn-back {
      display: inline-block;
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      font-weight: 600;
    }

    .footer {
      padding: 50px 0 70px;
      color: var(--sub);
      font-size: 0.95rem;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 720px) {
      .nav {
        flex-direction: column;
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="logo">GNE 근육병 뉴스레터</div>
      <nav class="nav-links">
        <a href="index.html">홈</a>
        <a href="latest.html">최신 리포트</a>
        <a href="archive.html">아카이브</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>GNE 근육병이란?</h1>
        <p class="page-subtitle">
          GNE 근육병의 원인, 증상, 진단, 치료에 대한 정보를 준비 중입니다.
        </p>
      </div>
    </section>

    <section class="content">
      <div class="container">
        <div class="coming-soon">
          <div class="coming-soon-icon">🔬</div>
          <h2>콘텐츠 준비 중입니다</h2>
          <p>
            GNE 근육병에 대한 포괄적이고 이해하기 쉬운 설명을 준비하고 있습니다.<br>
            조금만 기다려 주세요!
          </p>
          <a href="index.html" class="btn-back">홈으로 돌아가기</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div>GNE 근육병 뉴스레터 프로젝트</div>
    </div>
  </footer>

</body>
</html>
