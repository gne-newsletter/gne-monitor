<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아카이브 - GNE 근육병 뉴스레터</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e293b;
      --sub: #64748b;
      --line: #e2e8f0;
      --primary: #3b82f6;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.95rem;
      color: var(--sub);
    }

    .page-header {
      padding: 60px 0 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }

    .page-subtitle {
      color: var(--sub);
      font-size: 1.1rem;
    }

    .content {
      padding: 40px 0 80px;
    }

    .report-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .report-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .report-card:hover {
      transform: translateY(-2px);
    }

    .report-date {
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .report-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .report-stats {
      display: flex;
      gap: 20px;
      color: var(--sub);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .report-stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-view {
      display: inline-block;
      padding: 10px 18px;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .footer {
      padding: 50px 0 70px;
      color: var(--sub);
      font-size: 0.95rem;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 720px) {
      .nav {
        flex-direction: column;
        gap: 14px;
      }

      .report-stats {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="logo">GNE 근육병 뉴스레터</div>
      <nav class="nav-links">
        <a href="index.html">홈</a>
        <a href="latest.html">최신 리포트</a>
        <a href="archive.html" style="color: var(--primary);">아카이브</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>📚 리포트 아카이브</h1>
        <p class="page-subtitle">
          과거 발행된 모든 GNE 근육병 연구 리포트를 확인할 수 있습니다.
        </p>
      </div>
    </section>

    <section class="content">
      <div class="container">
        <div class="report-list">

          <!-- 리포트 1 -->
          <div class="report-card">
            <div class="report-date">2026년 5월 10일</div>
            <div class="report-title">GNE 근육병 연구 현황 리포트</div>
            <div class="report-stats">
              <div class="report-stat">📄 논문 35건</div>
              <div class="report-stat">🧪 임상시험 22건</div>
              <div class="report-stat">🤖 AI 요약 10건</div>
            </div>
            <a href="latest.html" class="btn-view">리포트 보기 →</a>
          </div>

          <!-- 향후 리포트가 추가되면 여기에 자동으로 추가됩니다 -->

        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div>GNE 근육병 뉴스레터 프로젝트</div>
    </div>
  </footer>

</body>
</html>
